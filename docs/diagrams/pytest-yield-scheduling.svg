<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1120" viewBox="0 0 1240 1120">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4870b5"/></marker></defs>
<rect width="1240" height="1120" fill="#f5f7fb"/>
<style>text {font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill:#172b4d} .title {font-size:30px;font-weight:700} .subtitle {font-size:19px;fill:#52647d} .head {font-size:21px;font-weight:650} .body {font-size:19px} .small {font-size:17px;fill:#52647d} .line {stroke:#4870b5;stroke-width:2.5;fill:none;marker-end:url(#arrow)} .lane {stroke:#c4cfdf;stroke-width:2;stroke-dasharray:6 7}</style>
<text x="40" y="52" class="title" text-anchor="start">pytest 如何调度 yield？</text><text x="40" y="86" class="subtitle" text-anchor="start">yield 保存函数执行位置；pytest / pluggy 决定何时启动、暂停和恢复。</text><rect x="30" y="110" width="1180" height="455" rx="14" fill="#ffffff" stroke="#d9e2ef"/><text x="52" y="148" class="head" text-anchor="start">① fixture：准备 → 交出对象 → 执行测试 → 清理</text><rect x="75" y="168" width="290" height="42" rx="14" fill="#eaf0fa" stroke="#d9e2ef"/><text x="220" y="196" class="head" text-anchor="middle">pytest 调度器</text><path d="M220,216 L220,507" class="lane"/><rect x="475" y="168" width="290" height="42" rx="14" fill="#eaf0fa" stroke="#d9e2ef"/><text x="620" y="196" class="head" text-anchor="middle">fixture 生成器</text><path d="M620,216 L620,507" class="lane"/><rect x="865" y="168" width="290" height="42" rx="14" fill="#eaf0fa" stroke="#d9e2ef"/><text x="1010" y="196" class="head" text-anchor="middle">测试函数</text><path d="M1010,216 L1010,507" class="lane"/><path d="M220,241 L620,241" class="line"/><text x="244" y="233" class="small" text-anchor="start">启动：next(generator)</text><rect x="505" y="252" width="230" height="54" rx="14" fill="#edf7ef" stroke="#d9e2ef"/><text x="620" y="285" class="body" text-anchor="middle">创建 client</text><path d="M620,325 L220,325" class="line"/><text x="238" y="317" class="small" text-anchor="start">yield client：交出对象并暂停</text><rect x="510" y="342" width="220" height="48" rx="14" fill="#fff3d9" stroke="#d9e2ef"/><text x="620" y="373" class="small" text-anchor="middle">暂停，保留局部变量</text><path d="M220,372 L1010,372" class="line"/><text x="820" y="357" class="small" text-anchor="middle">传入 client，运行测试</text><path d="M1010,407 L220,407" class="line"/><text x="802" y="400" class="small" text-anchor="middle">测试结束（通过或失败）</text><path d="M220,443 L620,443" class="line"/><text x="240" y="435" class="small" text-anchor="start">收尾阶段：再次 next(generator)</text><rect x="505" y="453" width="230" height="48" rx="14" fill="#edf7ef" stroke="#d9e2ef"/><text x="620" y="483" class="body" text-anchor="middle">执行 client.close()</text><text x="52" y="539" class="small" text-anchor="start">function scope：通常每条测试后恢复；module / session：到对应作用域结束才恢复。</text><rect x="30" y="585" width="1180" height="430" rx="14" fill="#ffffff" stroke="#d9e2ef"/><text x="52" y="624" class="head" text-anchor="start">② Hook wrapper：暂停 → 其他 Hook 生成报告 → 接收结果</text><rect x="75" y="644" width="290" height="42" rx="14" fill="#eaf0fa" stroke="#d9e2ef"/><text x="220" y="672" class="head" text-anchor="middle">pluggy 调用机制</text><path d="M220,695 L220,977" class="lane"/><rect x="475" y="644" width="290" height="42" rx="14" fill="#eaf0fa" stroke="#d9e2ef"/><text x="620" y="672" class="head" text-anchor="middle">我们的 Hook wrapper</text><path d="M620,695 L620,977" class="lane"/><rect x="865" y="644" width="290" height="42" rx="14" fill="#eaf0fa" stroke="#d9e2ef"/><text x="1010" y="672" class="head" text-anchor="middle">其他 Hook 实现</text><path d="M1010,695 L1010,977" class="lane"/><path d="M220,719 L620,719" class="line"/><text x="245" y="711" class="small" text-anchor="start">启动：next(generator)</text><path d="M620,760 L220,760" class="line"/><text x="241" y="751" class="small" text-anchor="start">outcome = yield：暂停</text><path d="M220,802 L1010,802" class="line"/><text x="805" y="794" class="small" text-anchor="middle">调用其他 Hook</text><path d="M1010,847 L220,847" class="line"/><text x="792" y="839" class="small" text-anchor="middle">得到本阶段的 TestReport</text><path d="M220,897 L620,897" class="line"/><text x="235" y="878" class="small" text-anchor="start">send(outcome)：恢复并传入结果</text><rect x="452" y="909" width="336" height="63" rx="14" fill="#edf7ef" stroke="#d9e2ef"/><text x="620" y="935" class="body" text-anchor="middle">outcome.get_result()</text><text x="620" y="959" class="small" text-anchor="middle">取得 report，检查 report.failed</text><rect x="30" y="1032" width="1180" height="62" rx="14" fill="#eaf0fa" stroke="#d9e2ef"/><text x="52" y="1058" class="body" text-anchor="start">关键：yield 不会主动调用测试或其他 Hook。恢复动作由框架完成。</text><text x="52" y="1083" class="small" text-anchor="start">示意调用链；Hook 图对应 hookwrapper=True 的旧式包装器，实际实现由 pluggy 负责。</text></svg>